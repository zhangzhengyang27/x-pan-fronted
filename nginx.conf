server {
    listen 80;
    server_name _;

    # SPA 路由 fallback
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 静态资源缓存（vite 构建产物带 hash）
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 后端代理（可选）
    location /api/ {
        proxy_pass http://xpan-backend:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 供后端判断是否 HTTPS：Secure Cookie 只在安全连接下下发
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        client_max_body_size 10G;
        proxy_read_timeout 600s;
    }

    # WebSocket 反向代理（离线下载进度 / 分享统计 / 系统通知实时推送）
    # 必须显式声明 Upgrade/Connection 头，否则 WS 握手会被 nginx 当作普通 HTTP 处理而失败。
    # 注意：这里不能沿用 /api/ 的 location，需独立配置以携带升级头。
    location /ws/ {
        proxy_pass http://xpan-backend:8081/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # 健康检查
    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP：允许自身资源、Google Fonts、Umami 统计与 blob 媒体；
    # 内联脚本仅用于主题防闪烁与 Umami 初始化，故保留 'unsafe-inline'（后续可改为 hash/nonce）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://analytics.zhangzhengyang.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https://analytics.zhangzhengyang.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    # HSTS 仅对 HTTPS 生效；若 TLS 在网关终止，也应在网关层配置
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
}