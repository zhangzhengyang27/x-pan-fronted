<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" href="/favicon.ico"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#0070f3"/>
    <title>X Pan · 个人分布式存储</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
    <script>
      // 防闪烁：在首屏渲染前预置主题类
      (function () {
        try {
          var t = localStorage.getItem('x-pan-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = t ? t === 'dark' : prefersDark;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
</head>
<body
  class="bg-[--color-bg] text-[--color-text] antialiased"
  data-1p-ignore="true"
  data-lpignore="true"
  data-form-type="other"
>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
